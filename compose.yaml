services:
  explorer:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      HOTSPOTS_DATA_PATH: /data/hotspots.json
      HOTSPOTS_METADATA_PATH: /data/metadata.json
    volumes:
      - type: bind
        source: ./data/hotspots.json
        target: /data/hotspots.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/metadata.json
        target: /data/metadata.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 100
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
